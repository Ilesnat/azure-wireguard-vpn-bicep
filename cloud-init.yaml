#cloud-config
package_update: true
package_upgrade: false

packages:
  - wireguard
  - qrencode
  - curl

write_files:
  - path: /usr/local/sbin/configure-wireguard.sh
    owner: root:root
    permissions: '0700'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      umask 077
      install -d -m 0700 /etc/wireguard /root/clients

      if [[ ! -d /sys/class/net/eth0 ]]; then
        echo 'Expected primary network interface eth0 was not found.' >&2
        exit 1
      fi

      printf 'net.ipv4.ip_forward=1\n' > /etc/sysctl.d/99-wireguard-forward.conf
      sysctl --system

      if [[ -s /etc/wireguard/wg0.conf ]] &&
         [[ -s /root/clients/phone.conf ]] &&
         [[ -s /root/clients/laptop.conf ]] &&
         [[ -s /root/clients/tablet.conf ]]; then
        systemctl enable wg-quick@wg0
        systemctl restart wg-quick@wg0
        echo 'Existing WireGuard configuration retained and service restarted.'
        exit 0
      fi

      systemctl stop wg-quick@wg0 2>/dev/null || true
      rm -f /etc/wireguard/wg0.conf /root/clients/*

      server_private_key="$(wg genkey)"
      server_public_key="$(printf '%s' "${server_private_key}" | wg pubkey)"

      cat > /etc/wireguard/wg0.conf <<EOF
      [Interface]
      Address = 10.66.66.1/24
      ListenPort = 51820
      PrivateKey = ${server_private_key}
      PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -A FORWARD -o wg0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
      PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -D FORWARD -o wg0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE
      EOF

      metadata_url='http://169.254.169.254/metadata/instance/network/interface/0/ipv4/ipAddress/0/publicIpAddress?api-version=2021-02-01&format=text'
      public_ip=''
      for attempt in $(seq 1 30); do
        public_ip="$(curl --fail --silent --show-error --max-time 5 -H Metadata:true "${metadata_url}" || true)"
        if [[ "${public_ip}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          break
        fi
        sleep 2
      done

      if [[ ! "${public_ip}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        echo 'Unable to obtain the VM public IP from Azure Instance Metadata Service.' >&2
        exit 1
      fi

      create_peer() {
        local name="$1"
        local address="$2"
        local private_key
        local public_key
        local preshared_key

        private_key="$(wg genkey)"
        public_key="$(printf '%s' "${private_key}" | wg pubkey)"
        preshared_key="$(wg genpsk)"

        cat >> /etc/wireguard/wg0.conf <<EOF

      [Peer]
      # ${name}
      PublicKey = ${public_key}
      PresharedKey = ${preshared_key}
      AllowedIPs = ${address}/32
      EOF

        cat > "/root/clients/${name}.conf" <<EOF
      [Interface]
      PrivateKey = ${private_key}
      Address = ${address}/32
      DNS = 1.1.1.1

      [Peer]
      PublicKey = ${server_public_key}
      PresharedKey = ${preshared_key}
      Endpoint = ${public_ip}:51820
      AllowedIPs = 0.0.0.0/0, ::/0
      PersistentKeepalive = 25
      EOF

        printf '%s\n' "${public_key}" > "/root/clients/${name}.publickey"
        qrencode -o "/root/clients/${name}.png" -t PNG < "/root/clients/${name}.conf"
        chmod 0600 "/root/clients/${name}.conf" "/root/clients/${name}.png" "/root/clients/${name}.publickey"
        echo "Created ${name} at ${address}; credentials are stored only in /root/clients/."
      }

      create_peer phone 10.66.66.2
      create_peer laptop 10.66.66.3
      create_peer tablet 10.66.66.4

      chmod 0600 /etc/wireguard/wg0.conf
      systemctl enable --now wg-quick@wg0
      wg show
      echo 'WireGuard setup complete. Use sudo wg-show-client phone or sudo wg-export-client phone.'

  - path: /usr/local/sbin/wg-show-client
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      name="${1:-}"
      file="/root/clients/${name}.conf"
      if [[ ! "${name}" =~ ^[a-zA-Z0-9_-]+$ ]] || [[ ! -f "${file}" ]]; then
        echo 'Usage: sudo wg-show-client <client-name>' >&2
        echo 'Available clients:' >&2
        find /root/clients -maxdepth 1 -name '*.conf' -printf '  %f\n' 2>/dev/null | sed 's/\.conf$//' >&2
        exit 1
      fi

      echo "Scan this QR code with the WireGuard mobile app (${name}):"
      qrencode -t ANSIUTF8 < "${file}"

  - path: /usr/local/sbin/wg-export-client
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      name="${1:-}"
      target_user="${SUDO_USER:-}"
      source_dir=/root/clients

      if [[ -z "${target_user}" ]] || [[ "${target_user}" == root ]]; then
        echo 'Run this command with sudo from the administrator account.' >&2
        exit 1
      fi
      if [[ ! "${name}" =~ ^[a-zA-Z0-9_-]+$ ]] || [[ ! -f "${source_dir}/${name}.conf" ]]; then
        echo 'Usage: sudo wg-export-client <client-name>' >&2
        exit 1
      fi

      target_home="$(getent passwd "${target_user}" | cut -d: -f6)"
      target_group="$(id -gn "${target_user}")"
      install -o "${target_user}" -g "${target_group}" -m 0600 "${source_dir}/${name}.conf" "${target_home}/${name}.conf"
      install -o "${target_user}" -g "${target_group}" -m 0600 "${source_dir}/${name}.png" "${target_home}/${name}.png"
      echo "Exported ${target_home}/${name}.conf and ${target_home}/${name}.png."
      echo 'Copy them to your computer with scp, then delete these exported copies.'

  - path: /usr/local/sbin/wg-add-client
    owner: root:root
    permissions: '0700'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      name="${1:-}"
      address="${2:-}"
      clients_dir=/root/clients
      server_config=/etc/wireguard/wg0.conf

      if [[ ! "${name}" =~ ^[a-zA-Z0-9_-]+$ ]] ||
         [[ ! "${address}" =~ ^10\.66\.66\.([5-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-4])$ ]]; then
        echo 'Usage: sudo wg-add-client <name> <10.66.66.5-254>' >&2
        exit 1
      fi
      if [[ -e "${clients_dir}/${name}.conf" ]] || grep -Fq "AllowedIPs = ${address}/32" "${server_config}"; then
        echo 'That client name or VPN address is already in use.' >&2
        exit 1
      fi

      umask 077
      private_key="$(wg genkey)"
      public_key="$(printf '%s' "${private_key}" | wg pubkey)"
      preshared_key="$(wg genpsk)"
      server_public_key="$(wg show wg0 public-key)"
      public_ip="$(curl -fsS -H Metadata:true 'http://169.254.169.254/metadata/instance/network/interface/0/ipv4/ipAddress/0/publicIpAddress?api-version=2021-02-01&format=text')"

      cat >> "${server_config}" <<EOF

      [Peer]
      # ${name}
      PublicKey = ${public_key}
      PresharedKey = ${preshared_key}
      AllowedIPs = ${address}/32
      EOF

      cat > "${clients_dir}/${name}.conf" <<EOF
      [Interface]
      PrivateKey = ${private_key}
      Address = ${address}/32
      DNS = 1.1.1.1

      [Peer]
      PublicKey = ${server_public_key}
      PresharedKey = ${preshared_key}
      Endpoint = ${public_ip}:51820
      AllowedIPs = 0.0.0.0/0, ::/0
      PersistentKeepalive = 25
      EOF

      printf '%s\n' "${public_key}" > "${clients_dir}/${name}.publickey"
      qrencode -o "${clients_dir}/${name}.png" -t PNG < "${clients_dir}/${name}.conf"
      chmod 0600 "${clients_dir}/${name}.conf" "${clients_dir}/${name}.png" "${clients_dir}/${name}.publickey" "${server_config}"
      wg set wg0 peer "${public_key}" preshared-key <(printf '%s\n' "${preshared_key}") allowed-ips "${address}/32"
      echo "Added ${name} at ${address}. Run: sudo wg-show-client ${name}"

  - path: /usr/local/sbin/wg-remove-client
    owner: root:root
    permissions: '0700'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      name="${1:-}"
      clients_dir=/root/clients
      public_key_file="${clients_dir}/${name}.publickey"
      server_config=/etc/wireguard/wg0.conf

      if [[ ! "${name}" =~ ^[a-zA-Z0-9_-]+$ ]] || [[ ! -f "${public_key_file}" ]]; then
        echo 'Usage: sudo wg-remove-client <client-name>' >&2
        exit 1
      fi

      public_key="$(cat "${public_key_file}")"
      wg set wg0 peer "${public_key}" remove

      python3 - "${server_config}" "${name}" <<'PY'
      import re
      import sys
      from pathlib import Path

      path = Path(sys.argv[1])
      name = sys.argv[2]
      text = path.read_text()
      blocks = re.split(r'(?=^\[Peer\]$)', text, flags=re.MULTILINE)
      marker = re.compile(rf'^# {re.escape(name)}$', re.MULTILINE)
      kept = [block for block in blocks if not marker.search(block)]
      if len(kept) == len(blocks):
          raise SystemExit(f'Peer block for {name} was not found')
      path.write_text(''.join(kept).rstrip() + '\n')
      PY

      rm -f "${clients_dir}/${name}.conf" "${clients_dir}/${name}.png" "${public_key_file}"
      chmod 0600 "${server_config}"
      echo "Removed ${name} immediately and from the persistent configuration."

runcmd:
  - [bash, /usr/local/sbin/configure-wireguard.sh]

final_message: "WireGuard setup finished. Credentials remain under /root/clients and are not printed to logs."
